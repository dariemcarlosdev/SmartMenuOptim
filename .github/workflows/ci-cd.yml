  #     with:
  #       aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
  #       aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  #       application_name: ${{ secrets.AWS_EB_APP_NAME }}
  #       environment_name: ${{ secrets.AWS_EB_ENV_NAME }}
  #       version_label: ${{ github.sha }}
  #       region: ${{ secrets.AWS_REGION }}
  #       deployment_package: ./publish/SmartMenuOptim.API.zip

  # --- Optional: Deploy to Docker Hub ---
  # Uncomment and configure the following job if you want to push to Docker Hub
  # deploy-docker:
  #   needs: build-test
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: Login to Docker Hub
  #     uses: docker/login-action@v3
  #     with:
  #       username: ${{ secrets.DOCKERHUB_USERNAME }}
