name: CI/CD Pipeline

on:
  push:
    branches: [ GithubActions-Pipeline/hotfix-pgsql-offline-ci-test ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: SmartMenuDb
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

      # Install the EF Core CLI tool globally to manage migrations
    - name: Install EF Core CLI
      run: dotnet tool install --global dotnet-ef
  
      # Add this to ensure dotnet tools (like dotnet-ef) are on the PATH
    - name: Add dotnet tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # --- Ensure database migrations are applied before tests ---
      # Only run dotnet ef database update for the project where your DbContext (and therefore your migrations) actually live.
    - name: Apply EF Core Migrations
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=SmartMenuDb;Username=postgres;Password=admin123"
      run: dotnet ef database update --project SmartMenuOptim.API/SmartMenuOptim.API.csproj


      # --- List tables after migration to verify
    - name: List tables after migration
      run: |
       sudo apt-get install -y postgresql-client
       PGPASSWORD=admin123 psql -h localhost -U postgres -d SmartMenuDb -c '\dt'

      
    - name: Build solution
      run: dotnet build SmartMenuOptim.sln
      working-directory: ${{ github.workspace }}

    - name: Upload code coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: '**/TestResults/**/coverage.cobertura.xml'

    - name: Security check - vulnerable packages
      run: dotnet list package --vulnerable

    - name: Publish build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: publish
        path: |
          **/bin/Release/net9.0/publish/
          !**/obj/**

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore SmartMenuOptim.sln

    - name: Build Solution
      run: dotnet build SmartMenuOptim.sln --no-restore --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

