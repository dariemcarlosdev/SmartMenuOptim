# ==================================================================================================
# GitHub Actions CI/CD Workflow for the SmartMenuOptim Application
#
# Purpose:
# This workflow automates the build, test, security analysis, and deployment processes for the
# SmartMenuOptim application. It ensures code quality and consistency by running a series of
# automated checks and deployments whenever changes are pushed or pull requests are made to
# key branches.
#
# Publishing Strategy:
# - This pipeline correctly publishes only the entry-point projects: `SmartMenuOptim.API` and `SmartMenuOptim.Server`.
# - Shared libraries (`SmartMenuOptim.Shared`) are automatically included as dependencies during the publish step.
# - Test projects (`SmartMenuOptim.Tests`) are used only for running tests and are not published.
# ==================================================================================================
name: CI/CD Pipeline for SmartMenuOptim

# --------------------------------------------------------------------------------------------------
# Triggers:
# Defines the events that will trigger this workflow to run.
# --------------------------------------------------------------------------------------------------
on:
  push:
    branches:
        - Staging
        - master
        - env-dev/*       
        - env-staging/*

  pull_request:
    branches:
        - Staging
        - master
        - env-dev/*
        - env-staging/*

# ==================================================================================================
# Jobs:
# The workflow is composed of several jobs that run in a specific order.
#
# Job Execution Flow:
# 1. `build-test`: Compiles the code, runs tests against a temporary database, and packages the application.
# 2. `codeql-analysis`: Runs in parallel with `build-test` to perform static code analysis for security vulnerabilities.
# 3. `deploy-azure-server` & `deploy-azure-api`: Run after `build-test` and `codeql-analysis` succeed. They deploy the packaged applications to Azure.
# 4. `notify-on-failure` / `notify-on-success`: Run at the end to send a notification based on the final outcome of the pipeline.
# ==================================================================================================
jobs:
  # --------------------------------------------------------------------------------------------------
  # Job: build
  # Purpose: To build the entire solution and ensure all projects compile successfully.
  # --------------------------------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 and 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build SmartMenuOptim.sln --no-restore
      working-directory: ${{ github.workspace }}

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          **/bin
          **/obj

  # --------------------------------------------------------------------------------------------------
  # Job: test
  # Purpose: Executes all tests and collects code coverage information using coverlet
  # --------------------------------------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: build-output

    # Install the coverlet tool for code coverage collection
    - name: Install coverlet
      run: dotnet tool install --global coverlet.console

    # Run tests with coverage collection
    - name: Run tests with coverage
      run: |
        dotnet test --no-build \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=cobertura \
          /p:CoverletOutput=./TestResults/Coverage/ \
          /p:Exclude="[*]*.Migrations.*" \
          /p:Threshold=80

    # Generate HTML report from coverage data
    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@5.2.0
      with:
        reports: '**/Coverage/*.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'Html;Cobertura;Badges'

    # Upload detailed HTML coverage report
    - name: Upload detailed coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coveragereport

    # Upload coverage summary
    - name: Upload coverage summary
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-coverage
        path: '**/Coverage/*.cobertura.xml'

    # Add coverage summary to job summary
    - name: Coverage Summary Report
      if: always()
      run: |
        echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "Coverage report has been generated and is available as an artifact." >> $GITHUB_STEP_SUMMARY
        
        if [ -f "coveragereport/Summary.txt" ]; then
          echo "### Coverage Metrics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coveragereport/Summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

  # --------------------------------------------------------------------------------------------------
  # Job: security-scan
  # Purpose: Performs security checks on NuGet packages
  # --------------------------------------------------------------------------------------------------
  security-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Security check - vulnerable packages
      run: dotnet list package --vulnerable

  # --------------------------------------------------------------------------------------------------
  # Job: database-migrations
  # Purpose: Applies database migrations and verifies schema
  # --------------------------------------------------------------------------------------------------
  database-migrations:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: SmartMenuDb
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install EF Core CLI
      run: dotnet tool install --global dotnet-ef
  
    - name: Add dotnet tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Apply EF Core Migrations
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=SmartMenuDb;Username=postgres;Password=admin123"
      run: dotnet ef database update --project SmartMenuOptim.API/SmartMenuOptim.API.csproj

    - name: Verify Database Schema
      run: |
        sudo apt-get install -y postgresql-client
        PGPASSWORD=admin123 psql -h localhost -U postgres -d SmartMenuDb -c '\dt'

  # --------------------------------------------------------------------------------------------------
  # Job: publish
  # Purpose: Creates deployment packages for both API and Server applications
  # --------------------------------------------------------------------------------------------------
  publish:
    needs: [test, security-scan, database-migrations]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: build-output

    - name: Publish API app
      run: dotnet publish SmartMenuOptim.API/SmartMenuOptim.API.csproj --configuration Release --no-build --output ./publish/api

    - name: Publish Server app
      run: dotnet publish SmartMenuOptim.Server/SmartMenuOptim.Server.csproj --configuration Release --no-build --output ./publish/server

    - name: Upload deployment artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: publish
        path: ./publish

  # --------------------------------------------------------------------------------------------------
  # Job: codeql-analysis
  # Purpose: To perform static code analysis using GitHub's CodeQL engine to find security
  #          vulnerabilities in the codebase.
  # --------------------------------------------------------------------------------------------------
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore SmartMenuOptim.sln

    - name: Build Solution
      run: dotnet build SmartMenuOptim.sln --no-restore --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # --------------------------------------------------------------------------------------------------
  # Job: deploy-azure-server
  # Purpose: To deploy the Blazor Server application to an Azure Web App.
  # Depends on: `build-test` and `codeql-analysis`.
  # --------------------------------------------------------------------------------------------------
  deploy-azure-server:
    needs: [publish, codeql-analysis]
    env:
      AZURE_WEBAPP_SERVER_NAME: ${{ secrets.AZURE_WEBAPP_SERVER_NAME }}
      AZURE_WEBAPP_SERVER_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_SERVER_PUBLISH_PROFILE }}
    runs-on: ubuntu-latest
    steps:
    # Step 1: Download the build artifacts created in the `build-test` job.
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: publish
        path: ./publish

    # Step 2: Deploy the Server application to Azure using its publish profile.
    - name: Deploy Blazor Server to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_SERVER_NAME }}
        publish-profile: ${{ env.AZURE_WEBAPP_SERVER_PUBLISH_PROFILE }}
        package: ./publish/server

  # --------------------------------------------------------------------------------------------------
  # Job: deploy-azure-api
  # Purpose: To deploy the API application to an Azure Web App and apply database migrations
  #          to the production/staging database.
  # Depends on: `build-test` and `codeql-analysis`.
  # --------------------------------------------------------------------------------------------------
  deploy-azure-api:
    needs: [publish, codeql-analysis]
    env:
      AZURE_WEBAPP_API_NAME: ${{ secrets.AZURE_WEBAPP_API_NAME }}
      AZURE_WEBAPP_API_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_API_PUBLISH_PROFILE }}
    runs-on: ubuntu-latest
    steps:
    # Step 1: Download the build artifacts.
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: publish
        path: ./publish

    # Step 2: Deploy the API application to Azure.
    - name: Deploy API to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_API_NAME }}
        publish-profile: ${{ env.AZURE_WEBAPP_API_PUBLISH_PROFILE }}
        package: ./publish/api
    
    # Step 3: Set up .NET SDK to run the EF Core CLI.
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x' 
       
    # Step 4: Install the EF Core CLI tool.
    - name: Install EF Core CLI
      run: dotnet tool install --global dotnet-ef

    # Step 5: Add the .NET tools directory to the PATH.
    - name: Add dotnet tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    # Step 6: Apply EF Core migrations to the live Azure PostgreSQL database.
    # This is a critical step to ensure the database schema is in sync with the deployed application code.
    # It runs only for specific branches to prevent accidental changes to production.
    - name: Apply EF Core Migrations to Azure PostgreSQL
      if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/Staging'
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.NEON_POSTGRES_CONNECTION_STRING }}
      run: dotnet ef database update --project SmartMenuOptim.API/SmartMenuOptim.API.csproj --connection "$ConnectionStrings__DefaultConnection"

  # --------------------------------------------------------------------------------------------------
  # Job: notify-on-failure
  # Purpose: To send an email notification if any of the preceding jobs fail.
  # --------------------------------------------------------------------------------------------------
  notify-on-failure:
    if: failure()
    runs-on: ubuntu-latest
    needs: [build, test, security-scan, database-migrations, publish, codeql-analysis, deploy-azure-server, deploy-azure-api]
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
    - name: Send email on failure
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ env.SMTP_USERNAME }}
        password: ${{ env.SMTP_PASSWORD }}
        subject: "GitHub Actions CI/CD Pipeline Failed"
        to: softevolutionsl@gmail.com
        from: ${{ secrets.SMTP_USERNAME }}
        body: |
          The CI/CD pipeline for branch '${{ github.ref_name }}' has failed.
          Please check the Actions tab for details.

  # --------------------------------------------------------------------------------------------------
  # Job: notify-on-success
  # Purpose: To send an email notification when all jobs in the pipeline complete successfully.
  # --------------------------------------------------------------------------------------------------
  notify-on-success:
    if: success()
    runs-on: ubuntu-latest
    needs: [build, test, security-scan, database-migrations, publish, codeql-analysis, deploy-azure-server, deploy-azure-api]
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
    - name: Send email on success
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ env.SMTP_USERNAME }}
        password: ${{ env.SMTP_PASSWORD }}
        subject: "GitHub Actions CI/CD Pipeline Succeeded"
        to: softevolutionsl@gmail.com
        from: ${{ env.SMTP_USERNAME }}
        body: |
          The CI/CD pipeline for branch '${{ github.ref_name }}' has completed successfully.
          All checks for build, test, analysis, and deployment passed!
