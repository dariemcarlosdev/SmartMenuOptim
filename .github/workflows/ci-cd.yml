  #     run: |
  #       docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/smartmenuoptim:latest .
  #       docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartmenuoptim:latest

  # --- Notification on Failure ---
  notify-on-failure:
    if: failure()
    runs-on: ubuntu-latest
    needs: [build-test,codeql-analysis,deploy-azure-server,deploy-azure-api]
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
    - name: Send email on failure
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ env.SMTP_USERNAME }}
        password: ${{ env.SMTP_PASSWORD }}
        subject: "GitHub Actions CI/CD Pipeline Failed"
        to: softevolutionsl@gmail.com
        from: ${{ secrets.SMTP_USERNAME }}
        body: |
          The CI/CD pipeline for branch 'Staging' has failed.
          Please check the Actions tab for details.

  # --- Notification on Success ---
  notify-on-success:
    if: success()
    runs-on: ubuntu-latest
    needs: [build-test, codeql-analysis,deploy-azure]
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
    - name: Send email on success
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ env.SMTP_USERNAME }}
        password: ${{ env.SMTP_PASSWORD }}
        subject: "GitHub Actions CI/CD Pipeline Succeeded"
        to: softevolutionsl@gmail.com
        from: ${{ env.SMTP_USERNAME }}
        body: |
          The CI/CD pipeline for branch 'Staging' has completed successfully.
          All checks for build-test and codeql-analysis passed!